name: Daily Report Watchdog

on:
  schedule:
    # 21:17 Asia/Shanghai = 13:17 UTC.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      require_shadow:
        description: "Also require the v11 shadow run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ails-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.repository == 'ohmyviv/ails-intel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install
        run: pip install -e .
      - name: Check expected business run state
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          REQUIRE_SHADOW: ${{ inputs.require_shadow || false }}
        shell: bash
        run: |
          if [ "$REQUIRE_SHADOW" = "true" ]; then
            python -m ails_intel.watchdog --require-shadow
          else
            python -m ails_intel.watchdog
          fi
