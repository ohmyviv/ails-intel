name: Shadow Acceptance Validator

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Beijing report date (YYYY-MM-DD)"
        required: true
        type: string
      run_key:
        description: "Optional explicit run_key for an isolated manual rerun"
        required: false
        type: string
        default: ""
      attempt:
        description: "Optional fully-qualified Shadow attempt ID; blank uses latest"
        required: false
        type: string
        default: ""
      enforce_continuation:
        description: "Force source-failure continuation check for a manual pre-effective-date regression"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ails-shadow-acceptance-${{ inputs.run_key || inputs.date }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ohmyviv/ails-intel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install
        run: pip install -e .
      - name: Validate Shadow ledger
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          REPORT_DATE: ${{ inputs.date }}
          RUN_KEY: ${{ inputs.run_key || '' }}
          ATTEMPT_ID: ${{ inputs.attempt || '' }}
          ENFORCE_CONTINUATION: ${{ inputs.enforce_continuation || false }}
        shell: bash
        run: |
          args=(--date "$REPORT_DATE")
          if [ -n "$RUN_KEY" ]; then
            args+=(--run-key "$RUN_KEY")
          fi
          if [ -n "$ATTEMPT_ID" ]; then
            args+=(--attempt "$ATTEMPT_ID")
          fi
          if [ "$ENFORCE_CONTINUATION" = "true" ]; then
            args+=(--enforce-continuation)
          fi
          python -m ails_intel.shadow_acceptance_validator "${args[@]}"
