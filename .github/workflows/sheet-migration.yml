# .github/workflows/sheet-migration.yml

name: Sheet Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Migration ID
        required: true
        type: choice
        options:
          - sprint_4_6_a1
          - sprint_4_6_b1
      apply:
        description: Apply writes to the live Sheet
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ails-sheet-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'ohmyviv/ails-intel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sheet-migration

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install
        run: pip install -e .

      - name: Preview migration
        if: ${{ !inputs.apply }}
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          AILS_PRIVATE_MIGRATIONS_JSON: ${{ secrets.AILS_PRIVATE_MIGRATIONS_JSON }}
        run: python -m ails_intel.migrations --migration "${{ inputs.migration }}"

      - name: Apply migration and verify readback
        if: ${{ inputs.apply }}
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          AILS_PRIVATE_MIGRATIONS_JSON: ${{ secrets.AILS_PRIVATE_MIGRATIONS_JSON }}
        run: python -m ails_intel.migrations --migration "${{ inputs.migration }}" --apply

      - name: Validate existing live schema
        if: ${{ inputs.apply }}
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
        run: python -m ails_intel.schema_validator
