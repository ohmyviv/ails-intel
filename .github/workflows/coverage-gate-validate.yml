name: Coverage Gate State Validation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Target Beijing date (YYYY-MM-DD; blank = today)"
        required: false
        type: string
        default: ""
      attempt:
        description: "Optional fully-qualified shadow attempt ID (blank = latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ails-coverage-gate-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ohmyviv/ails-intel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install
        run: pip install -e .
      - name: Validate pre-freeze coverage gate state
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          TARGET_DATE: ${{ inputs.date || '' }}
          TARGET_ATTEMPT: ${{ inputs.attempt || '' }}
        shell: bash
        run: |
          args=()
          if [ -n "$TARGET_DATE" ]; then
            args+=(--date "$TARGET_DATE")
          fi
          if [ -n "$TARGET_ATTEMPT" ]; then
            args+=(--attempt "$TARGET_ATTEMPT")
          fi
          python -m ails_intel.coverage_gate_validator "${args[@]}"
