name: Sheet Migration Request

on:
  push:
    branches:
      - main
    paths:
      - .github/migrations/request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: ails-sheet-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'ohmyviv/ails-intel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sheet-migration

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install
        run: pip install -e .

      - name: Execute migration request
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
          AILS_PRIVATE_MIGRATIONS_JSON: ${{ secrets.AILS_PRIVATE_MIGRATIONS_JSON }}
        run: python -m ails_intel.migration_request_runner --request .github/migrations/request.json

      - name: Validate existing live schema
        env:
          AILS_SPREADSHEET_ID: ${{ secrets.AILS_SPREADSHEET_ID }}
        run: python -m ails_intel.schema_validator
