[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ails-intel"
version = "0.1.5"
description = "Recall-aware AI life science intelligence execution engine"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.160.0",
  "google-auth>=2.38.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
